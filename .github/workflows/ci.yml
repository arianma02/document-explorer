name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: document_explorer
          POSTGRES_USER: document_explorer
          POSTGRES_PASSWORD: local_development_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U document_explorer -d document_explorer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Check Python formatting
        run: python -m ruff format --check backend

      - name: Lint Python
        run: python -m ruff check backend

      - name: Build deployment image
        run: docker build -t document-explorer-backend backend
