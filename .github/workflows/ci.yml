name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: document_explorer
          POSTGRES_USER: document_explorer
          POSTGRES_PASSWORD: local_development_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U document_explorer -d document_explorer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

      - name: Check Python formatting
        run: python -m ruff format --check backend

      - name: Lint Python
        run: python -m ruff check backend

      - name: Build deployment image
        run: docker build -t document-explorer-backend backend

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Check types and build frontend
        run: npm run build -- --base=/document-explorer/
        env:
          VITE_API_URL: https://document-explorer.onrender.com

      - name: Test frontend API requests
        run: npm test

      - name: Upload frontend for GitHub Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy-frontend:
    name: Deploy frontend
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v5
